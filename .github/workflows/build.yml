name: Build

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libprotobuf-dev protobuf-compiler liblua5.3-dev
      
      - name: Configure CMake
        run: cmake -B build
      
      - name: Build
        run: cmake --build build -j8
      
      - name: Upload artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: soggy-linux
          path: build/soggy  # 根据实际生成的二进制文件名调整
