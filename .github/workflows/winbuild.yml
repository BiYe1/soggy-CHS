name: Build Windows EXE

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: actions/setup-vcpkg@v1
        with:
          vcpkgArgs: install protobuf lua --triplet x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: soggy-windows-exe
          path: build/Release/*.exe   # 根据实际生成的 exe 文件名调整