name: Build Windows EXE (MSYS2/MinGW)

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 可选：修复 src/soggy.cpp 中的 string_view 问题（如果未在仓库中修复）
      # 建议直接在源码中修复，这里不再使用 sed（容易出错）
      # 如果你已经在仓库中修复了，跳过此步骤

      - name: 安装 MSYS2 并配置环境
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-lua
          update: true

      - name: 使用 MSYS2 构建
        shell: msys2 {0}
        run: |
          cd $GITHUB_WORKSPACE
          # 使用 MinGW Makefiles 生成器
          cmake -B build -G "MinGW Makefiles"
          # 构建（使用所有核心）
          cmake --build build -j $(nproc)

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: soggy-windows-exe
          path: build/*.exe   # MinGW 生成在 build 根目录