name: Build Windows EXE

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 克隆 vcpkg 并引导
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
        shell: cmd

      - name: 安装依赖 (protobuf, lua)
        run: |
          cd vcpkg
          .\vcpkg install protobuf lua --triplet x64-windows --recurse
          if errorlevel 1 exit /b 1
        shell: cmd

      - name: 配置 CMake（指定 vcpkg 工具链和 Protobuf_DIR）
        run: |
          $ProtobufDir = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows\share\protobuf"
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DProtobuf_DIR="$ProtobufDir"

      - name: 构建 Release
        run: cmake --build build --config Release -j 4

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: soggy-windows-exe
          path: build/Release/*.exe