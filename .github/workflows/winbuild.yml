name: Build Windows EXE

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # 由于 actions/setup-vcpkg 不存在，手动克隆 vcpkg 并安装依赖
      - name: 安装 vcpkg 及依赖 (protobuf, lua)
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install protobuf lua --triplet x64-windows
        shell: cmd

      - name: 配置 CMake（指定 vcpkg 工具链）
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: 构建 Release 版本
        run: cmake --build build --config Release -j 4

      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: soggy-windows-exe
          path: build/Release/*.exe   # 根据实际生成的文件名调整